<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="세피리아 인벤토리 최적화">
  <!--
    인벤토리 2x2 칸. 밝은 파스텔 테마를 그대로 쓰면 흰 탭 배경에서 사라지므로
    타일 바탕은 잉크색으로 두고 칸만 팔레트 색을 쓴다.
    오른쪽 위 한 칸이 강조색 : '최적 자리를 찾아 놓았다'는 뜻.
    16px 에서도 읽히도록 도형은 5개로 제한한다.
  -->
  <rect width="32" height="32" rx="7" fill="#2c2623"/>
  <rect x="6"  y="6"  width="9" height="9" rx="2.5" fill="#f7f6f3"/>
  <rect x="17" y="6"  width="9" height="9" rx="2.5" fill="#c47a8a"/>
  <rect x="6"  y="17" width="9" height="9" rx="2.5" fill="#f7f6f3"/>
  <rect x="17" y="17" width="9" height="9" rx="2.5" fill="#c9a06a"/>
</svg>
